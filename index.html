<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZebPay Market Intelligence Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0c10;
  --bg2: #111318;
  --bg3: #181c24;
  --bg4: #1e2330;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #f0f2f8;
  --text2: #8892a4;
  --text3: #556070;
  --accent: #f5a623;
  --accent2: #ff6b35;
  --blue: #4a9eff;
  --blue2: #1a5fa0;
  --green: #36d67c;
  --green2: #1a5c38;
  --red: #ff4d6d;
  --red2: #7a1a2e;
  --purple: #9b6dff;
  --teal: #26d9b8;
  --teal2: #0d5c4e;
  --amber: #f5a623;
  --amber2: #6b4010;
  --radius: 12px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  overflow: hidden;
}

/* ── SIDEBAR ── */
.sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow-y: auto;
}
.sidebar-logo {
  padding: 1.5rem 1.25rem 1rem;
  border-bottom: 1px solid var(--border);
}
.logo-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, #f5a623, #ff6b35);
  border-radius: 10px;
  padding: 6px 12px 6px 8px;
}
.logo-badge .dot {
  width: 20px; height: 20px;
  background: rgba(255,255,255,0.9);
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #ff6b35;
}
.logo-badge span { font-size: 14px; font-weight: 600; color: #fff; letter-spacing: .02em; }
.sidebar-tagline { font-size: 11px; color: var(--text3); margin-top: 6px; }

/* ── CALENDAR ── */
.cal-section { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); }
.cal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: .75rem;
}
.cal-header h3 { font-size: 12px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; }
.cal-nav { display: flex; gap: 4px; }
.cal-nav button {
  width: 24px; height: 24px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text2);
  cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.cal-nav button:hover { background: var(--bg4); color: var(--text); }
.cal-month-year { font-size: 13px; font-weight: 500; color: var(--text); text-align: center; margin-bottom: .5rem; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-day-name { font-size: 9px; color: var(--text3); text-align: center; padding: 3px 0; font-weight: 500; text-transform: uppercase; }
.cal-day {
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--text2);
  border-radius: 6px; cursor: pointer;
  transition: all .15s; position: relative;
}
.cal-day:hover { background: var(--bg3); color: var(--text); }
.cal-day.has-data { color: var(--text); }
.cal-day.has-data::after {
  content: '';
  position: absolute; bottom: 2px;
  width: 4px; height: 4px;
  background: var(--accent);
  border-radius: 50%;
}
.cal-day.selected {
  background: var(--accent);
  color: #0a0c10;
  font-weight: 600;
}
.cal-day.selected::after { display: none; }
.cal-day.today { border: 1px solid var(--accent); color: var(--accent); }
.cal-day.today.selected { border-color: transparent; color: #0a0c10; }
.cal-day.other-month { opacity: 0.3; }
.cal-day.empty { cursor: default; }

/* ── SIDEBAR NAV ── */
.sidebar-nav { padding: .75rem 1rem; flex: 1; }
.nav-label { font-size: 10px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .07em; padding: 0 .25rem .4rem; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: .5rem .75rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all .15s;
  margin-bottom: 2px;
  font-size: 13px; color: var(--text2);
}
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: rgba(245,166,35,0.12); color: var(--accent); }
.nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; }
.nav-item .nav-badge {
  margin-left: auto; font-size: 10px; padding: 1px 6px;
  background: var(--red2); color: var(--red);
  border-radius: 10px; font-weight: 500;
}
.nav-item .nav-badge.green { background: var(--green2); color: var(--green); }

/* ── MAIN CONTENT ── */
.main {
  flex: 1;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.topbar {
  position: sticky; top: 0; z-index: 10;
  background: rgba(10,12,16,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: .875rem 1.5rem;
  display: flex; align-items: center; justify-content: space-between;
}
.topbar-left h2 { font-size: 16px; font-weight: 500; color: var(--text); }
.topbar-left .date-display { font-size: 12px; color: var(--text2); margin-top: 2px; }
.topbar-right { display: flex; align-items: center; gap: .75rem; }
.market-pill {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 20px; padding: 4px 10px;
  font-size: 12px; color: var(--text2);
}
.market-pill .dot-live { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.status-pill {
  font-size: 11px; font-weight: 500; padding: 4px 10px;
  border-radius: 20px; border: 1px solid;
}
.status-pill.fear { background: rgba(255,77,109,0.1); border-color: var(--red); color: var(--red); }
.status-pill.greed { background: rgba(54,214,124,0.1); border-color: var(--green); color: var(--green); }
.status-pill.neutral { background: rgba(245,166,35,0.1); border-color: var(--amber); color: var(--amber); }

.content-area { padding: 1.5rem; }

/* ── SECTION TABS ── */
.tab-nav {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 1.5rem;
}
.tab-btn {
  font-size: 12px; font-weight: 500;
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent; color: var(--text2);
  cursor: pointer; transition: all .15s;
}
.tab-btn:hover { border-color: var(--border2); color: var(--text); }
.tab-btn.active { background: var(--accent); color: #0a0c10; border-color: transparent; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── CARDS ── */
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
.grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .75rem; margin-bottom: 1.25rem; }

.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.1rem 1.25rem;
}
.card-title {
  font-size: 11px; font-weight: 500; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text3); margin-bottom: .6rem;
}
.card-value { font-size: 26px; font-weight: 600; color: var(--text); line-height: 1.2; }
.card-sub { font-size: 12px; color: var(--text2); margin-top: 3px; }
.card-sub.up { color: var(--green); }
.card-sub.down { color: var(--red); }

/* ── METRIC CARD ── */
.metric-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1rem 1.1rem;
}
.metric-card h4 { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: .35rem; display: flex; align-items: center; gap: 6px; }
.metric-card p { font-size: 12px; color: var(--text2); line-height: 1.6; }
.score-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.score-label { font-size: 10px; color: var(--text3); width: 90px; flex-shrink: 0; }
.score-bg { flex: 1; height: 4px; background: var(--bg4); border-radius: 2px; overflow: hidden; }
.score-fill { height: 100%; border-radius: 2px; transition: width .6s cubic-bezier(.4,0,.2,1); }
.fill-green { background: var(--green); }
.fill-amber { background: var(--amber); }
.fill-red { background: var(--red); }
.fill-blue { background: var(--blue); }
.fill-teal { background: var(--teal); }
.fill-purple { background: var(--purple); }
.score-num { font-size: 10px; color: var(--text3); width: 28px; text-align: right; flex-shrink: 0; }

/* ── BADGES ── */
.badge {
  display: inline-block; font-size: 10px; font-weight: 500;
  padding: 2px 8px; border-radius: 20px; border: 1px solid;
}
.badge-green { background: rgba(54,214,124,0.1); border-color: rgba(54,214,124,0.3); color: var(--green); }
.badge-red { background: rgba(255,77,109,0.1); border-color: rgba(255,77,109,0.3); color: var(--red); }
.badge-amber { background: rgba(245,166,35,0.1); border-color: rgba(245,166,35,0.3); color: var(--amber); }
.badge-blue { background: rgba(74,158,255,0.1); border-color: rgba(74,158,255,0.3); color: var(--blue); }
.badge-purple { background: rgba(155,109,255,0.1); border-color: rgba(155,109,255,0.3); color: var(--purple); }
.badge-teal { background: rgba(38,217,184,0.1); border-color: rgba(38,217,184,0.3); color: var(--teal); }

/* ── TABLE ── */
.intel-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.intel-table th {
  text-align: left; font-size: 10px; font-weight: 500; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text3);
  padding: 8px 10px; border-bottom: 1px solid var(--border);
}
.intel-table td {
  padding: 9px 10px; border-bottom: 1px solid var(--border);
  color: var(--text2); vertical-align: top; line-height: 1.5;
}
.intel-table td:first-child { color: var(--text); font-weight: 500; }
.intel-table tr:last-child td { border-bottom: none; }
.intel-table tr:hover td { background: var(--bg3); }

/* ── PRICE GRID ── */
.price-scenarios { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-top: .5rem; }
.price-box { background: var(--bg3); border-radius: var(--radius-sm); padding: .5rem .65rem; }
.price-box .case { font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: var(--text3); margin-bottom: 2px; }
.price-box .range { font-size: 12px; font-weight: 500; color: var(--text); }
.price-box.bull { border-left: 2px solid var(--green); }
.price-box.base { border-left: 2px solid var(--blue); }
.price-box.bear { border-left: 2px solid var(--red); }
.price-box .case.bull { color: var(--green); }
.price-box .case.base { color: var(--blue); }
.price-box .case.bear { color: var(--red); }

/* ── ACTION ITEMS ── */
.action-list { display: flex; flex-direction: column; gap: .5rem; }
.action-item {
  display: flex; align-items: flex-start; gap: 12px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: .85rem 1rem;
}
.action-num {
  font-size: 12px; font-weight: 600; min-width: 28px;
  font-family: 'DM Mono', monospace;
}
.action-body .action-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 3px; }
.action-body .action-desc { font-size: 12px; color: var(--text2); line-height: 1.5; }
.action-meta { margin-left: auto; flex-shrink: 0; }

/* ── NARRATIVE BARS ── */
.narr-row {
  display: flex; align-items: center; gap: 12px;
  padding: .65rem 0;
  border-bottom: 1px solid var(--border);
}
.narr-row:last-child { border-bottom: none; }
.narr-name { font-size: 12px; font-weight: 500; color: var(--text); width: 170px; flex-shrink: 0; }
.narr-bar-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.mini-row { display: flex; align-items: center; gap: 8px; }
.mini-lbl { font-size: 9px; color: var(--text3); width: 65px; flex-shrink: 0; text-transform: uppercase; letter-spacing: .04em; }
.mini-bg { flex: 1; height: 3px; background: var(--bg4); border-radius: 2px; overflow: hidden; }
.mini-fill { height: 100%; border-radius: 2px; }

/* ── CONTENT TABLE ── */
.content-table-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

/* ── COMPETITOR CARD ── */
.comp-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem;
}
.comp-card h4 { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: .35rem; }
.comp-card .comp-desc { font-size: 12px; color: var(--text2); line-height: 1.6; margin: .5rem 0; }
.opp-box {
  background: rgba(74,158,255,0.06); border: 1px solid rgba(74,158,255,0.15);
  border-radius: var(--radius-sm); padding: .5rem .75rem; margin-top: .5rem;
}
.opp-box .opp-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--blue); margin-bottom: 2px; }
.opp-box p { font-size: 11px; color: var(--text2); }
.alert-box {
  background: rgba(245,166,35,0.07); border: 1px solid rgba(245,166,35,0.2);
  border-radius: var(--radius-sm); padding: .75rem 1rem; margin-top: 1rem;
}
.alert-box p { font-size: 12px; color: #c88a1a; line-height: 1.5; }

/* ── SECTION HEADING ── */
.section-heading {
  font-size: 11px; font-weight: 500; text-transform: uppercase;
  letter-spacing: .07em; color: var(--text3);
  padding-bottom: .6rem; margin-bottom: .85rem;
  border-bottom: 1px solid var(--border);
}

/* ── PRIORITY ROW ── */
.priority-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: .75rem 0; border-bottom: 1px solid var(--border);
}
.priority-row:last-child { border-bottom: none; }
.priority-num { font-size: 18px; font-weight: 700; min-width: 36px; font-family: 'DM Mono', monospace; }
.priority-body .p-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 3px; }
.priority-body .p-desc { font-size: 12px; color: var(--text2); line-height: 1.5; }
.priority-tag { margin-left: auto; flex-shrink: 0; padding-top: 2px; }

/* ── NO DATA STATE ── */
.no-data {
  text-align: center; padding: 4rem 2rem;
  display: flex; flex-direction: column; align-items: center; gap: 1rem;
}
.no-data .icon { font-size: 48px; opacity: .3; }
.no-data h3 { font-size: 18px; font-weight: 500; color: var(--text2); }
.no-data p { font-size: 13px; color: var(--text3); max-width: 360px; line-height: 1.6; }
.add-report-btn {
  margin-top: .5rem;
  padding: 8px 20px;
  background: var(--accent);
  color: #0a0c10;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600;
  cursor: pointer;
  transition: opacity .15s;
}
.add-report-btn:hover { opacity: .85; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }

/* ── FEATURE MAP ── */
.feature-row {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1rem 1.1rem; margin-bottom: .75rem;
}
.feature-row h4 { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: .35rem; }
.feature-row .tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin: .4rem 0; }
.cta-strip {
  background: rgba(245,166,35,0.07); border: 1px solid rgba(245,166,35,0.15);
  border-radius: var(--radius-sm); padding: .5rem .75rem; margin-top: .5rem;
}
.cta-strip .cta-lbl { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--amber); margin-bottom: 2px; }
.cta-strip p { font-size: 11px; color: var(--text2); }
.reel-tip { font-size: 11px; color: var(--text3); margin-top: 4px; }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .sidebar { width: 220px; min-width: 220px; }
}
@media (max-width: 600px) {
  body { flex-direction: column; overflow: auto; }
  .sidebar { width: 100%; height: auto; min-height: unset; }
  .main { height: auto; overflow: visible; }
}
</style>
</head>

// ═══════════════════════════════════════════════════════
// CALENDAR STATE
// ═══════════════════════════════════════════════════════
let calDate = new Date(2026, 5, 1); // June 2026
let selectedDate = "2026-06-03";
let activeTab = "exec";

function pad(n) { return String(n).padStart(2, '0'); }
function dateKey(y, m, d) { return `${y}-${pad(m+1)}-${pad(d)}`; }

function renderCalendar() {
  const y = calDate.getFullYear();
  const m = calDate.getMonth();
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  document.getElementById("calMonthYear").textContent = `${months[m]} ${y}`;

  const grid = document.getElementById("calGrid");
  grid.innerHTML = "";

  const days = ["Su","Mo","Tu","We","Th","Fr","Sa"];
  days.forEach(d => {
    const el = document.createElement("div");
    el.className = "cal-day-name";
    el.textContent = d;
    grid.appendChild(el);
  });

  const first = new Date(y, m, 1).getDay();
  const total = new Date(y, m+1, 0).getDate();
  const prevTotal = new Date(y, m, 0).getDate();
  const today = new Date();
  const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());

  for (let i = 0; i < first; i++) {
    const el = document.createElement("div");
    el.className = "cal-day other-month";
    el.textContent = prevTotal - first + 1 + i;
    grid.appendChild(el);
  }

  for (let d = 1; d <= total; d++) {
    const el = document.createElement("div");
    const key = dateKey(y, m, d);
    let cls = "cal-day";
    if (REPORTS[key]) cls += " has-data";
    if (key === selectedDate) cls += " selected";
    if (key === todayKey) cls += " today";
    el.className = cls;
    el.textContent = d;
    el.onclick = () => selectDate(key);
    grid.appendChild(el);
  }

  const remaining = 42 - first - total;
  for (let d = 1; d <= remaining; d++) {
    const el = document.createElement("div");
    el.className = "cal-day other-month";
    el.textContent = d;
    grid.appendChild(el);
  }
}

function changeMonth(dir) {
  calDate.setMonth(calDate.getMonth() + dir);
  renderCalendar();
}

function selectDate(key) {
  selectedDate = key;
  renderCalendar();
  renderReport(key);
}

    document.getElementById("contentArea").innerHTML = `

        <div class="icon">📭</div>
        <h3>No report for ${dateStr}</h3>
        <p>There's no intelligence report for this date yet. Reports are added daily. Check back soon or select June 3, 2026 to see the sample report.</p>
        <button class="add-report-btn" onclick="selectDate('2026-06-03')">View June 3, 2026 Report →</button>
      </div>`;
    return;
  }

  document.getElementById("btcPrice").textContent = data.meta.btcPrice;
  document.getElementById("marketSentiment").textContent = data.meta.sentiment;
  document.getElementById("marketSentiment").className = `status-pill ${data.meta.sentimentClass}`;

  renderContent(data);
}

function switchTab(tab, el) {
  activeTab = tab;
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  if (el) el.classList.add("active");

  const data = REPORTS[selectedDate];
  if (data) renderContent(data);
}

function renderContent(data) {
  const area = document.getElementById("contentArea");

  let html = `<div class="tab-nav">`;
  const tabs = [
    { id: "exec", label: "Executive" }, { id: "market", label: "Market Trends" },
    { id: "competitor", label: "Competitors" }, { id: "narratives", label: "Narratives" },
    { id: "price", label: "Price Intel" }, { id: "content", label: "Content Ideas" },
    { id: "features", label: "ZebPay Features" }, { id: "priority", label: "Priority Index" }
  ];
  tabs.forEach(t => {
    html += `<button class="tab-btn${activeTab === t.id ? " active" : ""}" onclick="activeTab='${t.id}';renderContent(REPORTS['${selectedDate}']);updateNavActive('${t.id}')">${t.label}</button>`;
  });
  html += `</div>`;

  // Alert banner
  html += `<div class="alert-box" style="margin-bottom:1.25rem"><p>⚡ ${data.meta.headline}</p></div>`;

  if (activeTab === "exec") html += renderExec(data);
  else if (activeTab === "market") html += renderMarket(data);
  else if (activeTab === "competitor") html += renderCompetitor(data);
  else if (activeTab === "narratives") html += renderNarratives(data);
  else if (activeTab === "price") html += renderPrice(data);
  else if (activeTab === "content") html += renderContent2(data);
  else if (activeTab === "features") html += renderFeatures(data);
  else if (activeTab === "priority") html += renderPriority(data);

  area.innerHTML = html;
}

function updateNavActive(tab) {
  document.querySelectorAll(".nav-item").forEach((n, i) => {
    const tabIds = ["exec","market","competitor","narratives","price","content","features","priority"];
    n.classList.toggle("active", tabIds[i] === tab);
  });
}

function renderExec(data) {
  let html = `<div class="section-heading">Market Snapshot</div>`;
  html += `<div class="grid-4">`;
  data.metrics.forEach(m => {
    html += `<div class="card"><div class="card-title">${m.label}</div><div class="card-value">${m.value}</div><div class="card-sub ${m.subClass}">${m.sub}</div></div>`;
  });
  html += `</div>`;

  html += `<div class="section-heading">Top 5 Opportunities This Week</div>`;
  html += `<div class="action-list">`;
  data.opportunities.forEach(o => {
    html += `<div class="action-item">
      <div class="action-num" style="color:var(--accent)">${o.num}</div>
      <div class="action-body" style="flex:1">
        <div class="action-title">${o.title}</div>
        <div class="action-desc">${o.desc}</div>
        <div style="margin-top:4px;font-size:11px;color:var(--text3)">Feature: ${o.feature}</div>
      </div>
      <div class="action-meta"><span class="badge ${o.priorityClass}">${o.priority}</span></div>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="section-heading" style="margin-top:1.5rem">Top 5 Threats</div>`;
  html += `<div class="action-list">`;
  data.threats.forEach((t, i) => {
    html += `<div class="action-item">
      <div class="action-num" style="color:var(--red)">T${i+1}</div>
      <div class="action-body">
        <div class="action-title">${t.title}</div>
        <div class="action-desc">${t.desc}</div>
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function renderMarket(data) {
  let html = `<div class="section-heading">Market Trend Analysis</div>`;
  data.trends.forEach(t => {
    html += `<div class="metric-card" style="margin-bottom:.75rem">
      <h4><span class="badge ${t.badgeClass}">${t.name}</span></h4>`;
    t.scores.forEach(s => {
      html += `<div class="score-row">
        <span class="score-label">${s.label}</span>
        <div class="score-bg"><div class="score-fill ${s.cls}" style="width:${s.pct}%"></div></div>
        <span class="score-num">${s.pct/10}/10</span>
      </div>`;
    });
    html += `<p style="margin-top:8px;font-size:12px;color:var(--text2);line-height:1.6">${t.desc}</p>`;
    html += `<div class="cta-strip"><div class="cta-lbl">ZebPay Marketing Angle</div><p>${t.angle}</p></div>`;
    html += `</div>`;
  });
  return html;
}

function renderCompetitor(data) {
  let html = `<div class="section-heading">Competitor Intelligence</div>`;
  html += `<div class="grid-2">`;
  data.competitors.forEach(c => {
    html += `<div class="comp-card">
      <h4>${c.name}</h4>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.35rem">`;
    c.tags.forEach((t, i) => {
      html += `<span class="badge ${t.cls}">${t.label}</span>`;
    });
    html += `</div>
      <div class="comp-desc">${c.desc}</div>
      <div class="opp-box"><div class="opp-label">ZebPay Opportunity</div><p>${c.opp}</p></div>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="alert-box" style="margin-top:1rem"><p>🔑 Content gap this week: None of ZebPay's competitors are running an "Extreme Fear = SIP Opportunity" campaign. Own this narrative in the next 48 hours before others pivot to it.</p></div>`;

  html += `<div class="section-heading" style="margin-top:1.5rem">Competitive Content Gap Matrix</div>`;
  html += `<div class="content-table-wrap"><table class="intel-table"><thead><tr><th>Topic</th><th>Competitor Strength</th><th>Opportunity</th></tr></thead><tbody>`;
  const gaps = [
    ["SIP during market correction","Low — none running this","badge-green|10/10 — Own it now"],
    ["CryptoPacks rebalancing","None (unique feature)","badge-green|10/10 — ZebPay exclusive"],
    ["Security / trust narrative","WazirX weak, CoinDCX neutral","badge-teal|9/10"],
    ["TDS / tax compliance","KoinX covers well","badge-blue|8/10 — Partner amplify"],
    ["CLARITY Act India explainer","Low — Unocoin has one article","badge-blue|8/10"],
    ["AI crypto narrative (NEAR/TAO)","CoinDCX blog has some","badge-amber|7/10"],
    ["XRP payment rail India","Moderate — CoinSwitch covers XRP","badge-amber|7/10"],
    ["BTC price prediction SEO","CoinDCX dominates this","badge-amber|5/10 — Secondary"],
  ];
  gaps.forEach(g => {
    const [cls, val] = g[2].split("|");

  });
  html += `</tbody></table></div>`;
  return html;
}

function renderNarratives(data) {
  let html = `<div class="section-heading">Narrative Score Dashboard — June 2026</div>`;
  html += `<div class="content-table-wrap"><div style="padding:.75rem 1rem">`;
  data.narratives.forEach(n => {
    html += `<div class="narr-row">
      <div class="narr-name">${n.name}</div>
      <div class="narr-bar-group">`;
    n.bars.forEach(b => {
      html += `<div class="mini-row"><span class="mini-lbl">${b.lbl}</span><div class="mini-bg"><div class="mini-fill ${b.cls}" style="width:${b.pct}%"></div></div></div>`;
    });
    html += `</div>
      <div style="flex-shrink:0"><span class="badge ${n.scoreCls}">${n.score}</span></div>
    </div>`;
  });
  html += `</div></div>`;
  html += `<div class="alert-box" style="margin-top:1rem"><p>🔥 Hottest narrative for ZebPay this week: "Buying the dip via SIP" — maps directly to Bitcoin SIP + Extreme Fear moment. Secondary: XRP + AI infrastructure (NEAR/TAO) educational content.</p></div>`;
  return html;
}

function renderPrice(data) {
  let html = `<div class="section-heading">Price Intelligence — Probability Scenarios (Not Financial Advice)</div>`;
  data.prices.forEach(p => {
    html += `<div class="metric-card" style="margin-bottom:.75rem">
      <h4 style="justify-content:space-between">${p.coin} <span class="badge ${p.momentum}">${p.current}</span></h4>
      <p style="font-size:12px;color:var(--text2);margin:.35rem 0 .5rem;line-height:1.6">${p.note}</p>`;
    p.scenarios.forEach(s => {
      html += `<div style="margin-bottom:.5rem"><div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">${s.label}</div>
        <div class="price-scenarios" style="grid-template-columns:repeat(3,1fr)">
          <div class="price-box bull"><div class="case bull">Bull</div><div class="range">${s.bull}</div></div>
          <div class="price-box base"><div class="case base">Base</div><div class="range">${s.base}</div></div>
          <div class="price-box bear"><div class="case bear">Bear</div><div class="range">${s.bear}</div></div>
        </div></div>`;
    });
    html += `</div>`;
  });
  return html;
}

function renderContent2(data) {
  let html = `<div class="section-heading">Viral Reel Ideas — Top 20</div>`;
  html += `<div class="content-table-wrap"><table class="intel-table">

  data.reels.forEach(r => {

function renderFeatures(data) {
  let html = `<div class="section-heading">Trend → ZebPay Feature Mapping</div>`;
  data.features.forEach(f => {
    html += `<div class="feature-row">
      <h4>${f.trend}</h4>
      <div class="tag-row">`;
    f.tags.forEach((t, i) => {
      html += `<span class="badge ${f.tagCls[i]}">${t}</span>`;
    });
    html += `</div>
      <div class="cta-strip"><div class="cta-lbl">Suggested CTA</div><p>${f.cta}</p></div>
      <div class="reel-tip">💡 Reel concept: ${f.reel}</div>
    </div>`;
  });
  return html;
}

function renderPriority(data) {
  let html = `<div class="section-heading">Priority Action Index</div>`;
  html += `<div class="content-table-wrap" style="padding:.5rem 1rem">`;
  data.priorities.forEach(p => {
    html += `<div class="priority-row">
      <div class="priority-num" style="color:${p.numColor}">${p.num}</div>
      <div class="priority-body" style="flex:1">
        <div class="p-title">${p.title}</div>
        <div class="p-desc">${p.desc}</div>
      </div>
      <div class="priority-tag"><span class="badge ${p.tagCls}">${p.tag}</span></div>
    </div>`;
  });
  html += `</div>`;
  return html;
}
